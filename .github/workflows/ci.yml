name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both ends of the engines range (^22.19.0 || >=24.0.0).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # lib/ ships prebuilt so git installs run no build scripts. The build is
      # byte-deterministic (the CSS-module class map is emitted sorted), so a
      # src/ change whose rebuilt output was not committed alongside it fails
      # here — the one silent way this package breaks for users.
      - name: Prebuilt lib matches sources
        run: git diff --exit-code -- lib

      - run: pnpm check

      - run: pnpm test

      # The committed catalog snapshot must describe the locked pi-ai, or a
      # bump landed without its review trail.
      - name: Catalog snapshot is current
        run: node scripts/pi-ai-catalog.mjs --check
