name: Update pi-ai

# Weekly bump of the bundled @earendil-works/pi-ai: install the latest
# release under a tilde pin, rebuild the shipped lib/, run every gate, and
# open a PR whose body is the provider-catalog diff — new providers, new
# OAuth flows, protocol changes — so the review reads the consequences, not
# the lockfile. Gate failures do NOT suppress the PR: a broken upstream is
# exactly when the report matters, so failures are written into the PR body
# instead.
#
# Repo prerequisites:
# - Settings → Actions → "Allow GitHub Actions to create and approve pull
#   requests" must be enabled, or the final step fails with 403.
# - PRs opened with the default GITHUB_TOKEN do not trigger other workflows,
#   so the update/pi-ai PR carries no CI checks of its own; the gates run
#   inline here and their outcome is written into the PR body.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bump pi-ai to the latest release (tilde-pinned)
        id: bump
        run: |
          BEFORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('node_modules/@earendil-works/pi-ai/package.json')).version)")
          LATEST=$(npm view @earendil-works/pi-ai version)
          echo "before=${BEFORE} latest=${LATEST}"
          pnpm add "@earendil-works/pi-ai@~${LATEST}"
          echo "before=${BEFORE}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        if: steps.bump.outputs.changed == 'false'
        run: echo "Already on the latest pi-ai (${{ steps.bump.outputs.latest }}); no PR needed."

      - name: Rebuild shipped lib/
        if: steps.bump.outputs.changed == 'true'
        run: pnpm build

      - name: Gate — lint, types, knip
        id: gate_check
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: pnpm check

      - name: Gate — smoke tests
        id: gate_test
        if: steps.bump.outputs.changed == 'true'
        continue-on-error: true
        run: pnpm test

      - name: Compose PR body (catalog diff + gate outcomes)
        if: steps.bump.outputs.changed == 'true'
        env:
          BEFORE: ${{ steps.bump.outputs.before }}
          LATEST: ${{ steps.bump.outputs.latest }}
          CHECK: ${{ steps.gate_check.outcome }}
          TEST: ${{ steps.gate_test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ "$CHECK" != "success" ] || [ "$TEST" != "success" ]; then
              echo "> ⚠️ **GATES FAILED** — check: ${CHECK}, tests: ${TEST}. Do not merge before reading [the run log](${RUN_URL})."
              echo ""
            fi
            if [ "${BEFORE%.*}" != "${LATEST%.*}" ]; then
              echo "> ⚠️ **Crosses a minor version** (${BEFORE} → ${LATEST}). pi-ai is 0.x, so this may be a breaking change; review beyond the catalog diff."
              echo ""
            fi
            node scripts/pi-ai-catalog.mjs
            echo ""
            echo "---"
            echo "Gates ran inline in [this workflow run](${RUN_URL}); PRs opened by GITHUB_TOKEN carry no CI checks of their own."
          } > catalog-diff.md
          cat catalog-diff.md
          node scripts/pi-ai-catalog.mjs --update

      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/pi-ai
          commit-message: 'Bump @earendil-works/pi-ai to ${{ steps.bump.outputs.latest }}'
          title: 'Bump pi-ai to ${{ steps.bump.outputs.latest }}'
          body-path: catalog-diff.md
          add-paths: |
            package.json
            pnpm-lock.yaml
            lib
            scripts/pi-ai-catalog.snapshot.json
          delete-branch: true
